<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="title desc">
  <title id="title">MemHooks — mnemonic devices for agents</title>
  <desc id="desc">A restrained technical diagram showing MEMHOOKS files inherited from root to local folders, translated into native memory searches, filtered to relevant context, and supplied to an AI agent before work begins.</desc>
  <defs>
    <style>.serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}.ink{fill:#252628}.muted{fill:#66686d}.teal{fill:#2f7f83}.purple{fill:#6c5a88}.line{stroke:#c9c5bc;stroke-width:1.5}.hair{stroke:#d9d5cc;stroke-width:1}.box{fill:#fbfaf6;stroke:#c9c5bc;stroke-width:1.4}.soft{fill:#f1efe8}.none{fill:none}</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6c6d70"/></marker>
  </defs>
  <rect width="1600" height="680" rx="28" fill="#f7f5ef"/><line x1="70" y1="182" x2="1530" y2="182" class="hair"/>
  <text x="80" y="82" class="serif ink" font-size="64" font-weight="700">MemHooks</text><text x="82" y="125" class="serif purple" font-size="28" font-style="italic">Mnemonic devices for agents.</text><text x="82" y="155" class="sans muted" font-size="17" letter-spacing="2">FILESYSTEM-SCOPED MEMORY RECALL</text>
  <g transform="translate(1372 44)" stroke="#252628" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="56" cy="18" r="12" stroke-width="5"/><path d="M56 30v72c0 48-66 49-66 2 0-27 24-40 47-28" stroke-width="7"/><path d="M20 73l18 3-8 17" stroke-width="5"/><path d="M-2 119c22 10 55 10 76 0" stroke="#2f7f83" stroke-width="2"/><path d="M9 129c17 6 39 6 56 0" stroke="#6c5a88" stroke-width="2"/></g>
  <g class="sans">
    <g transform="translate(80 225)"><text x="0" y="0" class="teal" font-size="16" font-weight="800">01</text><text x="0" y="33" class="ink" font-size="22" font-weight="700">Place a hook</text><text x="0" y="60" class="muted" font-size="16">Put MEMHOOKS.md where context matters.</text><g transform="translate(0 92)"><path d="M18 4h46l12 12h84v34H18z" class="soft" stroke="#8d8a82" stroke-width="1.4"/><path d="M45 51v40m0-24h72m0 0v34" class="none line"/><circle cx="45" cy="67" r="4" fill="#2f7f83"/><circle cx="117" cy="67" r="4" fill="#6c5a88"/><rect x="82" y="94" width="104" height="58" rx="5" class="box"/><text x="92" y="117" class="mono ink" font-size="12">MEMHOOKS.md</text><text x="92" y="137" class="mono muted" font-size="11">recall_queries:</text></g></g>
    <path d="M350 390h50" stroke="#6c6d70" stroke-width="1.6" marker-end="url(#arrow)"/>
    <g transform="translate(420 225)"><text x="0" y="0" class="purple" font-size="16" font-weight="800">02</text><text x="0" y="33" class="ink" font-size="22" font-weight="700">Merge root → local</text><text x="0" y="60" class="muted" font-size="16">Nearest context adds specificity.</text><g transform="translate(0 94)"><rect x="0" y="0" width="215" height="45" rx="6" class="box"/><text x="14" y="19" class="mono muted" font-size="11">/MEMHOOKS.md</text><text x="14" y="35" class="mono teal" font-size="11">project decisions</text><rect x="20" y="58" width="215" height="45" rx="6" class="box"/><text x="34" y="77" class="mono muted" font-size="11">/backend/MEMHOOKS.md</text><text x="34" y="93" class="mono purple" font-size="11">backend history</text><rect x="40" y="116" width="215" height="45" rx="6" class="box"/><text x="54" y="135" class="mono muted" font-size="11">/auth/MEMHOOKS.md</text><text x="54" y="151" class="mono ink" font-size="11">auth constraints</text></g></g>
    <path d="M690 390h50" stroke="#6c6d70" stroke-width="1.6" marker-end="url(#arrow)"/>
    <g transform="translate(760 225)"><text x="0" y="0" class="teal" font-size="16" font-weight="800">03</text><text x="0" y="33" class="ink" font-size="22" font-weight="700">Run native recall</text><text x="0" y="60" class="muted" font-size="16">Use whatever memory system is available.</text><g transform="translate(0 96)"><circle cx="49" cy="52" r="34" class="none" stroke="#2f7f83" stroke-width="2.3"/><path d="M75 78l28 28" stroke="#2f7f83" stroke-width="4" stroke-linecap="round"/><text x="126" y="18" class="mono ink" font-size="13">recall_queries</text><text x="126" y="44" class="mono ink" font-size="13">entities + tags</text><text x="126" y="70" class="mono ink" font-size="13">includes</text><text x="126" y="96" class="mono purple" font-size="13">excludes / anti-recall</text><text x="126" y="122" class="mono ink" font-size="13">scope + inheritance</text></g></g>
    <path d="M1030 390h50" stroke="#6c6d70" stroke-width="1.6" marker-end="url(#arrow)"/>
    <g transform="translate(1100 225)"><text x="0" y="0" class="purple" font-size="16" font-weight="800">04</text><text x="0" y="33" class="ink" font-size="22" font-weight="700">Load only what matters</text><text x="0" y="60" class="muted" font-size="16">Relevant memories reach the agent.</text><g transform="translate(0 96)"><path d="M10 0h164l-55 72v56H65V72z" class="soft" stroke="#8d8a82" stroke-width="1.5"/><circle cx="48" cy="12" r="5" fill="#2f7f83"/><circle cx="83" cy="-4" r="5" fill="#6c5a88"/><circle cx="118" cy="14" r="5" fill="#2f7f83"/><circle cx="73" cy="148" r="5" fill="#2f7f83"/><circle cx="95" cy="148" r="5" fill="#6c5a88"/><text x="190" y="22" class="mono ink" font-size="12">✓ rationale</text><text x="190" y="47" class="mono ink" font-size="12">✓ past failures</text><text x="190" y="72" class="mono ink" font-size="12">✓ constraints</text><text x="190" y="97" class="mono purple" font-size="12">× obsolete paths</text></g></g>
  </g>
  <line x1="80" y1="545" x2="1520" y2="545" class="hair"/>
  <g transform="translate(80 575)" class="sans"><text x="0" y="0" class="muted" font-size="14" font-weight="700" letter-spacing="1.4">EXAMPLES INCLUDED</text><text x="0" y="35" class="ink" font-size="18">Hindsight</text><circle cx="88" cy="29" r="3" fill="#c9c5bc"/><text x="108" y="35" class="ink" font-size="18">OpenViking</text><circle cx="230" cy="29" r="3" fill="#c9c5bc"/><text x="250" y="35" class="ink" font-size="18">Honcho</text><circle cx="330" cy="29" r="3" fill="#c9c5bc"/><text x="350" y="35" class="ink" font-size="18">Any memory system</text><text x="760" y="0" class="muted" font-size="14" font-weight="700" letter-spacing="1.4">THE RULE</text><text x="760" y="35" class="serif ink" font-size="21" font-style="italic">“A good hook doesn’t catch more fish. It catches the right ones.”</text></g>
  <text x="80" y="655" class="sans muted" font-size="14">Agent-agnostic · retrieval-only · backend-adaptive · tiny by design</text>
</svg>
