# Add this block to ~/.hermes/config.yaml
#
# pre_llm_call: deterministically loads the applicable MEMHOOKS.md chain.
# post_tool_call: deterministically maintains file-scoped recall anchors.
# Neither hook makes an extra LLM call.

hooks:
  pre_llm_call:
    - command: "python3 ~/.hermes/agent-hooks/memhooks_pre_llm.py"
      timeout: 5
  post_tool_call:
    - command: "python3 ~/.hermes/agent-hooks/memhooks_update.py event"
      timeout: 5

# Optional for non-interactive Gateway/Desktop starts after you have reviewed
# the scripts. Otherwise approve each hook once at the Hermes prompt.
# hooks_auto_accept: true
