name: Cleanup release scaffolding

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-release-scaffolding.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary release branch and this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/release-trigger-v0.2.1" || true

          FILE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/cleanup-release-scaffolding.yml?ref=main" --jq .sha)
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/contents/.github/workflows/cleanup-release-scaffolding.yml" \
            -f message='chore: remove release cleanup workflow' \
            -f sha="$FILE_SHA" \
            -f branch=main
